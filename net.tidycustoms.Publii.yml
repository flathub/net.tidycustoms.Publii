app-id: net.tidycustoms.Publii
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
command: publii
separate-locales: false

finish-args:
  - --share=ipc
  - --share=network # website deployment: ftp, sftp, s3, github, etc.
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-documents/Publii:create # path to Publii data folder in user's documents
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons

build-options:
  append-path: /usr/lib/sdk/node24/bin
  env:
    NPM_CONFIG_LOGLEVEL: info

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man

modules:
  # libsecret... electron base app already builds libsecret, but removes
  # /include & /lib/pkgconfig during cleanup. keytar needs them for the
  # node-gyp build. so, version, sha256 and config-opts are taken 1:1
  # from the base app and the cleanup is missing here on purpose.
  - name: libsecret
    buildsystem: meson
    config-opts:
      - -Dmanpage=false
      - -Dcrypto=libgcrypt # secret portal is only compiled when crypto is on
      - -Dvapi=false
      - -Dgtk_doc=false
      - -Dintrospection=false
      - -Dbash_completion=disabled
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libsecret/0.21/libsecret-0.21.7.tar.xz
        sha256: 6b452e4750590a2b5617adc40026f28d2f4903de15f1250e1d1c40bfd68ed55e

  - name: publii
    buildsystem: simple
    subdir: main
    build-options:
      env:
        # flatpak-node-generator cache & electron-dist
        XDG_CACHE_HOME: /run/build/publii/flatpak-node/cache
        npm_config_cache: /run/build/publii/flatpak-node/npm-cache
        npm_config_offline: 'true'

    build-commands:
      # BUILD TOOLS: webpack, sass, electron-builder
      - npm install --offline

      # RUNTIME DEPS: app/package.json, keytar
      - cd app && npm install --offline

      # RENDERER BUNDLE: app/dist/build.js
      - npm run prod

      # EDITOR ASSETS: sass, tinymce, jquery -> app/dist/vendor
      - mkdir -p app/dist/css
      - npm run prepare-editor

      # BUILD DIRECTORY: unpacked linux directory with publii own electron-builder config
      - |
        . ../flatpak-node/electron-builder-arch-args.sh
        ./node_modules/.bin/electron-builder build $ELECTRON_BUILDER_ARCH_ARGS --linux --dir --config.npmRebuild=false

      # INSTALL
      - cp -a dist/linux*unpacked /app/main
      - rm -f /app/main/chrome-sandbox # zypak replaces chromium sandbox
      - rm -f /app/main/LICENSES.chromium.html # no need for 19 mb chromium license
      - install -Dm755 -t /app/bin/ ../publii
      - install -Dm644 ../net.tidycustoms.Publii.desktop /app/share/applications/net.tidycustoms.Publii.desktop
      - install -Dm644 ../net.tidycustoms.Publii.metainfo.xml /app/share/metainfo/net.tidycustoms.Publii.metainfo.xml
      - |
        ICONS=/app/share/icons/hicolor/512x512/apps
        mkdir -p $ICONS
        gdk-pixbuf-thumbnailer -s 512 build/icon.png $ICONS/net.tidycustoms.Publii.png

    sources:
      # no x-checker-data on purpose. version bumps go through github workflow,
      # because generated-sources.json must be regenerated along with the tag.
      - type: git
        url: https://github.com/GetPublii/Publii.git
        tag: v.0.48.3-build-17587
        commit: 47b79cf045d650063cec74d48ef956e55cbe61cc
        dest: main

      # upstream creates sites/ and config/ only when the data folder is missing.
      # --filesystem=...:create makes flatpak create it first, so both are skipped
      # and publii errors
      - type: patch
        path: create-missing-data-dirs.patch
        dest: main

      # PUBLII AFTERPACK-HOOK: upstream calls setuid() on the chrome sandbox.
      # sandboxing is handled by zypak.
      - type: inline
        contents: |
          exports.default = () => true;
        dest: main/build/scripts
        dest-filename: afterPack.js

      - generated-sources.json

      - type: file
        path: net.tidycustoms.Publii.desktop
      - type: file
        path: net.tidycustoms.Publii.metainfo.xml

      # START: zypak-wrapper & ozone-hint for native electron on wayland
      - type: script
        dest-filename: publii
        commands:
          - exec zypak-wrapper.sh /app/main/Publii --ozone-platform-hint=auto "$@"
